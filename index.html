<!DOCTYPE html>

<head>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <!-- Favicon (inline SVG, zero extra request) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='50' y='71' font-family='Georgia,serif' font-size='62' font-weight='700' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,700;0,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Betül Alkan",
    "url": "https://betulalkan.com/",
    "image": "https://betulalkan.com/images/profile-photo.jpg",
    "jobTitle": "UI/UX Designer & Editor",
    "email": "mailto:betulalkan98@gmail.com",
    "address": { "@type": "PostalAddress", "addressLocality": "Istanbul", "addressCountry": "TR" },
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "Istanbul Gelişim University" },
    "knowsAbout": ["Branding", "UI/UX Design", "Video Editing", "Motion Graphics", "Visual Storytelling"]
  }
  </script>
</head>
<body>

  <main class="stage" id="stage" data-view="idle">

    <!-- Hero (title/subtitle/pill reposition per view via CSS) -->
    <h1 class="hero-title">Hi, I&rsquo;m Betül</h1>
    <p class="hero-subtitle">I design user-friendly interfaces and engaging digital experiences.</p>

    <div class="pill" id="pill">
      <button class="pill__toggle" id="pillToggle" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="pill__my">My</span>
        <span class="pill__seg">
          <span id="pillCurrent">Tools</span>
          <svg class="chevron" width="14" height="9" viewBox="0 0 14 9" fill="none" aria-hidden="true">
            <path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </button>
      <ul class="pill-menu" id="pillMenu" role="listbox" hidden>
        <li role="option" data-view="tools">Tools</li>
        <li role="option" data-view="projects">Projects</li>
        <li role="option" aria-disabled="true">Abilities <span class="soon">Soon</span></li>
        <li role="option" aria-disabled="true">Intelligences <span class="soon">Soon</span></li>
        <li role="option" aria-disabled="true">Education <span class="soon">Soon</span></li>
        <li role="option" aria-disabled="true">Experience <span class="soon">Soon</span></li>
        <li role="option" aria-disabled="true">Story <span class="soon">Soon</span></li>
      </ul>
    </div>

    <!-- IDLE: doodle decorations -->
    <div class="doodles" id="doodles" aria-hidden="true">
      <div class="dot-grid"></div>
      <img class="doodle doodle--star"   src="images/decor/star.svg"   alt="" />
      <img class="doodle doodle--crown"  src="images/decor/crown.svg"  alt="" />
      <img class="doodle doodle--motion-a" src="images/decor/motion-a.svg" alt="" />
      <img class="doodle doodle--motion-b" src="images/decor/motion-b.svg" alt="" />
      <img class="doodle doodle--motion-c" src="images/decor/motion-c.svg" alt="" />
      <img class="doodle doodle--pen"    src="images/decor/pen.svg"    alt="" />
      <img class="doodle doodle--heart-a" src="images/decor/heart-a.svg" alt="" />
      <img class="doodle doodle--heart-b" src="images/decor/heart-b.svg" alt="" />
      <img class="doodle doodle--plane-body" src="images/decor/plane-body.svg" alt="" />
      <img class="doodle doodle--plane-fin"  src="images/decor/plane-fin.svg"  alt="" />
      <img class="doodle doodle--plane-trail" src="images/decor/plane-trail.svg" alt="" />
    </div>

    <!-- TOOLS -->
    <div class="tools-view" id="toolsView">
      <a class="contact-link" href="mailto:betulalkan98@gmail.com">Contact me</a>
      <img class="tools-arc-bg" src="images/decor/tools-arc.svg" alt="" />
      <div class="tool-icon tool-icon--xd">
        <img src="images/logo-adobe-xd.png" alt="Adobe XD" />
      </div>
      <div class="tool-icon tool-icon--ps">
        <img src="images/logo-photoshop.png" alt="Adobe Photoshop" />
      </div>
      <div class="tool-icon tool-icon--ai">
        <img src="images/logo-illustrator.png" alt="Adobe Illustrator" />
      </div>
      <div class="tool-icon tool-icon--ae">
        <img src="images/logo-after-effects.png" alt="Adobe After Effects" />
      </div>
      <div class="tool-icon tool-icon--pr">
        <img src="images/logo-premiere.png" alt="Adobe Premiere Pro" />
      </div>
      <div class="tool-icon tool-icon--figma">
        <img src="images/logo-figma.png" alt="Figma" />
      </div>
    </div>

    <!-- PROJECTS -->
    <div class="projects-view" id="projectsView">
      <button class="carousel-arrow carousel-arrow--prev" id="carPrev" type="button" aria-label="Previous project">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 3L5 9L11 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow carousel-arrow--next" id="carNext" type="button" aria-label="Next project">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M7 3L13 9L7 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </div>

  </main>

  <!-- PROJECT DETAIL OVERLAY -->
  <div class="detail-overlay" id="detailOverlay" hidden>
    <button class="detail-close" id="detailClose" type="button" aria-label="Close">&times;</button>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <script src="projects-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
